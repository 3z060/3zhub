<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>3zhub</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://avatars.githubusercontent.com; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="أحدث أدوات وأكواد GitHub مصنفة حسب المجال">
  <meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="3zhub">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="top-row">
      <a href="#/" class="brand" aria-label="3zhub">
        <img src="icons/icon.svg" alt="" width="30" height="30">
        <span>3z<b>hub</b></span>
      </a>
      <div class="top-actions">
        <button id="btn-search" class="icon-btn" aria-label="بحث">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </button>
        <button id="btn-refresh" class="icon-btn" aria-label="تحديث">
          <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
        </button>
      </div>
    </div>
    <div id="search-bar" class="search-bar" hidden>
      <input id="search" type="search" placeholder="ابحث عن أداة، لغة، أو وسم…" autocomplete="off" dir="auto">
    </div>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabs" aria-label="التنقل">
    <a href="#/" data-tab="home">
      <svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/></svg><span>الأحدث</span>
    </a>
    <a href="#/mine" data-tab="mine">
      <svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.5 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg><span>مجالاتي</span>
    </a>
    <a href="#/saved" data-tab="saved">
      <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg><span>المحفوظة</span>
    </a>
    <a href="#/settings" data-tab="settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg><span>الإعدادات</span>
    </a>
  </nav>

  <div id="lock" class="lock" hidden>
    <form id="lock-form" class="lock-card" autocomplete="off">
      <img src="icons/icon.svg" alt="" width="72" height="72">
      <h1>3z<b>hub</b></h1>
      <p>🔒 التطبيق مقفل</p>
      <button type="button" id="lock-face" class="btn primary lock-face" hidden>
        <svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M9 9v1M15 9v1M12 9v4h-1M9 16c1.7 1.3 4.3 1.3 6 0"/></svg>
        الفتح بـ Face ID
      </button>
      <input id="lock-pass" type="password" placeholder="كلمة المرور" autocomplete="current-password" dir="auto" required>
      <button id="lock-btn" type="submit" class="btn primary">فتح</button>
      <div id="lock-msg" class="lock-msg" role="alert"></div>
    </form>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js" type="module"></script>
</body>
</html>
